name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Package addon
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --prefix="MidnightFrames/" -o build.tar HEAD
          mkdir build && tar -xf build.tar -C build
          # git archive stamps every file with the commit time; a sorted list
          # and no extra attributes make the zip byte-identical per tag.
          (cd build && find MidnightFrames -print | LC_ALL=C sort \
            | zip -qX "../MidnightFrames-${version}.zip" -@)

      - name: Write checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256sum "MidnightFrames-${version}.zip" > "MidnightFrames-${version}.zip.sha256"
          cat "MidnightFrames-${version}.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: MidnightFrames-*.zip

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { grab = 1; next }
            grab && index($0, "## [") == 1 { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$version" \
            --notes-file RELEASE_NOTES.md \
            "MidnightFrames-${version}.zip" \
            "MidnightFrames-${version}.zip.sha256"
