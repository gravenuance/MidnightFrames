name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package addon
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --prefix="MidnightFrames/" -o build.tar HEAD
          mkdir build && tar -xf build.tar -C build
          (cd build && zip -qr "../MidnightFrames-${version}.zip" MidnightFrames)

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$version" \
            --notes-file RELEASE_NOTES.md \
            "MidnightFrames-${version}.zip"
